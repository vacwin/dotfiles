set -g status-bg '#051519'
set -g status-fg '#e2d8cd'
set -g status-left '#[fg=#6096bf,bold]#S #[default]'
set -g status-right '#[fg=#8ed0ce]#($HOME/dotfiles/tmux/network.sh) #[fg=#626765]%a %d %b #[fg=#e2d8cd]%I:%M %p'
set -g window-status-style 'fg=#626765,bg=default'
set -g window-status-format '#[fg=#626765]#I #[fg=#626765]#W'
set -g window-status-current-style 'fg=#e2d8cd,bg=#1b282b,bold'
set -g window-status-current-format '#[fg=#f8818e,bg=#1b282b] #I:#W #[default]'
set -g pane-border-style 'fg=#2d3839'
set -g pane-active-border-style 'fg=#8ed0ce'
set -g message-style 'fg=#e2d8cd,bg=#1b282b'
set -g message-command-style 'fg=#e2d8cd,bg=#1b282b'
setw -g mode-style 'fg=#051519,bg=#1a8e63'
