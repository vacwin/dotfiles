# Generated from themes/mono.conf (dark) by scripts/theme. Do not edit.
set -g status-bg '#1b1b1a'
set -g status-fg '#e6e5e2'
set -g status-left '#[fg=#fbfaf7,bold]#S #[default]'
set -g status-right '#[fg=#b9b8b5]#($HOME/dotfiles/tmux/network.sh) #[fg=#555553]%a %d %b #[fg=#e6e5e2]%I:%M %p'
set -g window-status-style 'fg=#555553,bg=default'
set -g window-status-format '#[fg=#555553]#I #[fg=#555553]#W'
set -g window-status-current-style 'fg=#e6e5e2,bg=#242423,bold'
set -g window-status-current-format '#[fg=#fbfaf7,bg=#242423] #I:#W #[default]'
set -g pane-border-style 'fg=#242423'
set -g pane-active-border-style 'fg=#fbfaf7'
set -g message-style 'fg=#e6e5e2,bg=#242423'
set -g message-command-style 'fg=#e6e5e2,bg=#242423'
setw -g mode-style 'fg=#1b1b1a,bg=#fbfaf7'
