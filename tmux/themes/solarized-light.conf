set -g status-bg '#fdf6e3'
set -g status-fg '#586e75'
set -g status-left '#[fg=#268bd2,bold]#S #[default]'
set -g status-right '#[fg=#2aa198]#($HOME/dotfiles/tmux/network.sh) #[fg=#93a1a1]%a %d %b #[fg=#586e75]%I:%M %p'
set -g window-status-style 'fg=#93a1a1,bg=default'
set -g window-status-format '#[fg=#93a1a1]#I #[fg=#93a1a1]#W'
set -g window-status-current-style 'fg=#586e75,bg=#eee8d5,bold'
set -g window-status-current-format '#[fg=#268bd2,bg=#eee8d5] #I:#W #[default]'
set -g pane-border-style 'fg=#eee8d5'
set -g pane-active-border-style 'fg=#2aa198'
set -g message-style 'fg=#586e75,bg=#eee8d5'
set -g message-command-style 'fg=#586e75,bg=#eee8d5'
setw -g mode-style 'fg=#fdf6e3,bg=#268bd2'
