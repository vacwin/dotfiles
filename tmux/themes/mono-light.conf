set -g pane-border-style 'fg=#deddda'
set -g pane-active-border-style 'fg=#000000'
set -g message-style 'fg=#1c1b19,bg=#deddda'
set -g message-command-style 'fg=#1c1b19,bg=#deddda'
setw -g mode-style 'fg=#e7e6e3,bg=#000000'
