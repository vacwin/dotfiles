set -g status-bg '#272c30'
set -g status-fg '#cfb9a8'
set -g status-left '#[fg=#5c6f7d,bold]#S #[default]'
set -g status-right '#[fg=#515e67]#($HOME/dotfiles/tmux/network.sh) #[fg=#6e6762]%a %d %b #[fg=#cfb9a8]%I:%M %p'
set -g window-status-style 'fg=#6e6762,bg=default'
set -g window-status-format '#[fg=#6e6762]#I #[fg=#6e6762]#W'
set -g window-status-current-style 'fg=#cfb9a8,bg=#383a3c,bold'
set -g window-status-current-format '#[fg=#934e46,bg=#383a3c] #I:#W #[default]'
set -g pane-border-style 'fg=#454546'
set -g pane-active-border-style 'fg=#515e67'
set -g message-style 'fg=#cfb9a8,bg=#383a3c'
set -g message-command-style 'fg=#cfb9a8,bg=#383a3c'
setw -g mode-style 'fg=#272c30,bg=#c79e84'
