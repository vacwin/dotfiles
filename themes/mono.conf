# themes/mono.conf — единственное место, где задаются цвета.
#
# Палитра монохромная (чёрный/белый/серый, как в kkohs-swagpapers):
# никаких оттенков, только ступени яркости. Формат — bash: файл просто
# сорсится из scripts/theme.
#
# Редактируй значения здесь, потом:
#   theme render     — перегенерировать файлы всех приложений
#   theme sync       — сгенерировать и применить текущий light/dark режим
#   theme toggle     — переключить light/dark (биндинг SUPER+SHIFT+.)
#
# Добавить новую тему = скопировать этот файл (например themes/paper.conf)
# и запустить THEME=paper theme render.

name="mono"

# Токены, которые попадают в CSS/шаблоны. Порядок не важен.
tokens=(bg bg_raised bg_hover border ash slate steel dim silver teal frost fg urgent root)

# ─────────────────────────────── dark ───────────────────────────────
# bg       — фон терминала/бара            bg_raised — панели, пилюли
# bg_hover — hover/выделение               border    — разделители, рамки
# ash      — приглушённый текст            slate     — вторичный служебный
# steel    — подписи                       dim       — третичный текст
# silver   — почти основной текст          fg        — основной текст
# teal     — вторичный акцент              frost     — главный акцент
# urgent   — критическое состояние
# root     — единственный цветной акцент: промпт root (чтобы не путать)

dark_bg="#1b1b1a"
dark_bg_raised="#242423"
dark_bg_hover="#2e2e2d"
dark_border="#363635"
dark_ash="#555553"
dark_slate="#6d6d6a"
dark_steel="#8a8a86"
dark_dim="#a4a4a0"
dark_silver="#c4c4c0"
dark_teal="#b9b8b5"
dark_frost="#fbfaf7"
dark_fg="#e6e5e2"
dark_urgent="#ffffff"
dark_root="#d75f5f"

# ANSI 0..15 — то, что видят ls/git/fzf и терминал.
# В монохроме это просто градации серого без hue.
# alpha_* — прозрачность слоёв waybar (bar/pill/tooltip), 0.0..1.0
dark_alpha_bar=0.65
dark_alpha_pill=0.5
dark_alpha_tooltip=0.92
dark_ansi=(
  "#101010" # 0  black
  "#a4a4a0" # 1  red
  "#8a8a86" # 2  green
  "#c4c4c0" # 3  yellow
  "#fbfaf7" # 4  blue
  "#6d6d6a" # 5  magenta
  "#b9b8b5" # 6  cyan
  "#e6e5e2" # 7  white
  "#555553" # 8  bright black
  "#a4a4a0" # 9  bright red
  "#8a8a86" # 10 bright green
  "#c4c4c0" # 11 bright yellow
  "#ffffff" # 12 bright blue
  "#6d6d6a" # 13 bright magenta
  "#b9b8b5" # 14 bright cyan
  "#ffffff" # 15 bright white
)

# ─────────────────────────────── light ──────────────────────────────

light_bg="#e7e6e3"
light_bg_raised="#deddda"
light_bg_hover="#d4d3d0"
light_border="#c8c7c4"
light_ash="#9a9996"
light_slate="#7c7b78"
light_steel="#65645f"
light_dim="#4f4e4a"
light_silver="#3a3936"
light_teal="#4c4b48"
light_frost="#000000"
light_fg="#1c1b19"
light_urgent="#000000"
light_root="#b5433f"

light_alpha_bar=0.72
light_alpha_pill=0.5
light_alpha_tooltip=0.94

light_ansi=(
  "#1c1b19" # 0  black
  "#4f4e4a" # 1  red
  "#666560" # 2  green
  "#7d7c79" # 3  yellow
  "#3a3936" # 4  blue
  "#8f8e8b" # 5  magenta
  "#565550" # 6  cyan
  "#a5a4a0" # 7  white
  "#3a3936" # 8  bright black
  "#4f4e4a" # 9  bright red
  "#666560" # 10 bright green
  "#7d7c79" # 11 bright yellow
  "#2a2927" # 12 bright blue
  "#8f8e8b" # 13 bright magenta
  "#565550" # 14 bright cyan
  "#cfcecb" # 15 bright white
)
