# themes/mono.conf — единственное место, где задаются цвета.
#
# Палитра монохромная (чёрный/белый/серый, как в kkohs-swagpapers):
# никаких оттенков, только ступени яркости. Формат — bash: файл просто
# сорсится из scripts/theme.
#
# Редактируй значения здесь, потом:
#   theme render     — перегенерировать файлы всех приложений
#   theme sync       — сгенерировать и применить текущий light/dark режим
#   theme toggle     — переключить light/dark (биндинг SUPER+SHIFT+.)
#
# Добавить новую тему = скопировать этот файл (например themes/paper.conf)
# и запустить THEME=paper theme render.

name="mono"

# Токены, которые попадают в CSS/шаблоны. Порядок не важен.
tokens=(bg surface surface_hover border text text_secondary text_tertiary text_muted text_subtle text_faint accent accent_muted critical root)

# ─────────────────────────────── dark ───────────────────────────────
# Фон и поверхности: bg, surface, surface_hover, border.
# Текст по убыванию яркости: text (основной) → text_secondary →
#   text_tertiary → text_muted → text_subtle → text_faint.
# Акценты: accent (главный), accent_muted (вторичный).
# Состояния: critical (критическое), root (промпт root, чтобы не путать).

dark_bg="#1b1b1a"
dark_surface="#242423"
dark_surface_hover="#2e2e2d"
dark_border="#363635"
dark_text_faint="#555553"
dark_text_subtle="#6d6d6a"
dark_text_muted="#8a8a86"
dark_text_tertiary="#a4a4a0"
dark_text_secondary="#c4c4c0"
dark_accent_muted="#b9b8b5"
dark_accent="#fbfaf7"
dark_text="#e6e5e2"
dark_critical="#ffffff"
dark_root="#d75f5f"

# ANSI 0..15 — то, что видят ls/git/fzf и терминал.
# В монохроме это просто градации серого без hue.
# alpha_* — прозрачность слоёв waybar (bar/pill/tooltip), 0.0..1.0
dark_alpha_bar=0.65
dark_alpha_pill=0.5
dark_alpha_tooltip=0.92
dark_ansi=(
  "#101010" # 0  black
  "#a4a4a0" # 1  red
  "#8a8a86" # 2  green
  "#c4c4c0" # 3  yellow
  "#fbfaf7" # 4  blue
  "#6d6d6a" # 5  magenta
  "#b9b8b5" # 6  cyan
  "#e6e5e2" # 7  white
  "#555553" # 8  bright black
  "#a4a4a0" # 9  bright red
  "#8a8a86" # 10 bright green
  "#c4c4c0" # 11 bright yellow
  "#ffffff" # 12 bright blue
  "#6d6d6a" # 13 bright magenta
  "#b9b8b5" # 14 bright cyan
  "#ffffff" # 15 bright white
)

# ─────────────────────────────── light ──────────────────────────────

light_bg="#e7e6e3"
light_surface="#deddda"
light_surface_hover="#d4d3d0"
light_border="#c8c7c4"
light_text_faint="#9a9996"
light_text_subtle="#7c7b78"
light_text_muted="#65645f"
light_text_tertiary="#4f4e4a"
light_text_secondary="#3a3936"
light_accent_muted="#4c4b48"
light_accent="#000000"
light_text="#1c1b19"
light_critical="#000000"
light_root="#b5433f"

light_alpha_bar=0.72
light_alpha_pill=0.5
light_alpha_tooltip=0.94

light_ansi=(
  "#1c1b19" # 0  black
  "#4f4e4a" # 1  red
  "#666560" # 2  green
  "#7d7c79" # 3  yellow
  "#3a3936" # 4  blue
  "#8f8e8b" # 5  magenta
  "#565550" # 6  cyan
  "#a5a4a0" # 7  white
  "#3a3936" # 8  bright black
  "#4f4e4a" # 9  bright red
  "#666560" # 10 bright green
  "#7d7c79" # 11 bright yellow
  "#2a2927" # 12 bright blue
  "#8f8e8b" # 13 bright magenta
  "#565550" # 14 bright cyan
  "#cfcecb" # 15 bright white
)
