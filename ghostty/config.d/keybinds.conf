keybind = ctrl+shift+KeyV=paste_from_clipboard
keybind = ctrl+shift+KeyC=copy_to_clipboard

macos-option-as-alt = true
keybind = super+t=new_tab
keybind = super+n=new_window
keybind = super+shift+r=reload_config

# vim-like scrollback (like the M-j/M-k binds in tmux)
# unconsumed: still forwards the key to the program, so tmux gets M-j/M-k too
keybind = unconsumed:alt+j=scroll_page_lines:1
keybind = unconsumed:alt+k=scroll_page_lines:-1
keybind = unconsumed:alt+u=scroll_page_fractional:-0.5
keybind = unconsumed:alt+d=scroll_page_fractional:0.5
