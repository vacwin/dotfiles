# Generated from themes/{{name}}.conf ({{mode}}) by scripts/theme. Do not edit.
# Colors
bg         = 0x00{{bg_rgb}}
fg         = 0x00{{text_rgb}}
border_fg  = 0x00{{accent_rgb}}
error_bg   = 0x00{{bg_rgb}}
error_fg   = 0x01{{accent_muted_rgb}}

# Clean/minimalist
hide_version_string  = true
hide_keyboard_locks  = true
hide_key_hints       = true
blank_box            = false
box_title            = null
clock                = %H:%M

# Input
asterisk     = •
input_len    = 28
default_input = login
save         = true
session_log  = .local/state/ly-session.log

animation = none
