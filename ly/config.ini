# Guts theme
# 0xSSRRGGBB — SS: styling (01=bold, 02=underline...), RRGGBB: hex color
# 0x00000000 — use terminal default

# Colors
bg         = 0x00101113   # Guts bg
fg         = 0x009f9e99   # Guts fg
border_fg  = 0x00697a9a   # Guts blue
error_bg   = 0x00101113   # Guts bg
error_fg   = 0x0193554b   # Guts red (bold)

# Clean/minimalist
hide_version_string  = true
hide_keyboard_locks  = true
hide_key_hints       = true
blank_box            = false
box_title            = null
clock                = %H:%M

# Input
asterisk     = •
input_len    = 28
default_input = login
save         = true
session_log  =

animation = none
