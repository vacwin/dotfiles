# Traffic theme
# 0xSSRRGGBB — SS: styling (01=bold, 02=underline...), RRGGBB: hex color
# 0x00000000 — use terminal default

# Colors
bg         = 0x00272c30   # Traffic bg
fg         = 0x00cfb9a8   # Traffic fg
border_fg  = 0x00515e67   # Traffic blue
error_bg   = 0x00272c30   # Traffic bg
error_fg   = 0x01934e46   # Traffic red (bold)

# Clean/minimalist
hide_version_string  = true
hide_keyboard_locks  = true
hide_key_hints       = true
blank_box            = false
box_title            = null
clock                = %H:%M

# Input
asterisk     = •
input_len    = 28
default_input = login
save         = true
session_log  = .local/state/ly-session.log

animation = none
