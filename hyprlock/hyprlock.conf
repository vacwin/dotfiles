# Guts
# bg:    #101113
# fg:    #9f9e99
# gray:  #554a62
# red:   #93554b

source = ~/.config/hypr/conf.d/local.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 2
    blur_size = 4
    brightness = 0.7
}

image {
    monitor = 
    path = $avatar
    size = 200
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor = 
    size = 280, 48
    position = 0, -140
    halign = center
    valign = center
    dots_size = 0.25
    dots_spacing = 0.3
    rounding = -1

    outline_thickness = 2
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgb(9f9e99)
    check_color = rgba(0, 0, 0, 0)
    fail_color = rgb(93554b)

    fade_on_empty = true
    placeholder_text =
    hide_input = false
    fail_text = KURWA WRONG
}

label {
    monitor = 
    text = $TIME12
    #text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgb(9f9e99)
    font_size = 64
    font_family = Iosevka Nerd Font Mono
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor = 
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgb(554a62)
    font_size = 14
    font_family = Iosevka Nerd Font Mono
    position = 0, 120
    halign = center
    valign = center
}
