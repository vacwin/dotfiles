source = ~/.config/hypr/conf.d/local.conf
# palette: symlink switched by scripts/theme
source = ~/dotfiles/hyprlock/colors.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 2
    blur_size = 4
    brightness = $brightness
}

image {
    monitor = 
    path = $avatar
    size = 200
    rounding = -1
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor = 
    size = 280, 48
    position = 0, -140
    halign = center
    valign = center
    dots_size = 0.25
    dots_spacing = 0.3
    rounding = -1

    outline_thickness = 2
    outer_color = rgba(0, 0, 0, 0)
    inner_color = $inner
    font_color = $fg
    check_color = rgba(0, 0, 0, 0)
    fail_color = $teal

    fade_on_empty = true
    placeholder_text =
    hide_input = false
    fail_text = KURWA WRONG
}

label {
    monitor = 
    text = $TIME12
    #text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = $fg
    font_size = 64
    font_family = Iosevka Nerd Font Mono
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor = 
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = $ash
    font_size = 14
    font_family = Iosevka Nerd Font Mono
    position = 0, 120
    halign = center
    valign = center
}
